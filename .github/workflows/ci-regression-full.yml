name: Full smoke regression
run-name: Full smoke regression application=${{ inputs.application_commit || github.sha }} workflow=${{ github.workflow_sha }}

on:
  workflow_dispatch:
    inputs:
      application_commit:
        description: Exact 40-character application commit to validate
        required: true
        type: string
  schedule:
    - cron: "17 2 * * 1,3,5"

permissions:
  contents: read

concurrency:
  group: ci-regression-full-${{ inputs.application_commit || github.sha }}
  cancel-in-progress: false

jobs:
  complete-inventory:
    name: Complete exact-tree inventory with governed isolation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      AEROASSIST_DB_MODE: memory
      DEMO_AUTH_ENABLED: "true"
      SEED_ON_STARTUP: "true"
      SEED_ENDPOINT_ENABLED: "true"
      APPLICATION_COMMIT: ${{ inputs.application_commit || github.sha }}
      WORKFLOW_DEFINITION_COMMIT: ${{ github.workflow_sha }}

    steps:
      - name: Check out exact application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.application_commit || github.sha }}
          fetch-depth: 0

      - name: Initialize runner paths
        run: |
          document_export_dir="$RUNNER_TEMP/document-exports"
          mkdir -p "$document_export_dir"
          echo "DOCUMENT_EXPORT_STORAGE_DIR=$document_export_dir" >> "$GITHUB_ENV"

      - name: Verify exact application commit and record lineage
        run: |
          [[ "$APPLICATION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_DEFINITION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${APPLICATION_COMMIT}^{commit}"
          checked_out_head="$(git rev-parse HEAD)"
          test "$checked_out_head" = "$APPLICATION_COMMIT"
          CHECKED_OUT_APPLICATION_COMMIT="$checked_out_head" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "application_commit": os.environ["APPLICATION_COMMIT"],
              "workflow_definition_commit": os.environ["WORKFLOW_DEFINITION_COMMIT"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "checked_out_application_tree": os.environ["CHECKED_OUT_APPLICATION_COMMIT"],
              "validation_result": "running",
          }
          Path(os.environ["RUNNER_TEMP"]).joinpath("full-regression-lineage.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python3 -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend

      - name: Run full pilot release validation orchestrator
        run: python3 backend/scripts/run_pilot_release_validation.py --profile full --include-docker-config --output "${RUNNER_TEMP}/pilot-release-validation.json"

      - name: Finalize exact-tree lineage
        if: always()
        env:
          VALIDATION_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]).joinpath("full-regression-lineage.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["validation_result"] = os.environ["VALIDATION_RESULT"]
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload sanitized full regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-smoke-regression-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pilot-release-validation.json
            ${{ runner.temp }}/full-regression-lineage.json
          if-no-files-found: error
          retention-days: 14

      - name: Clean generated application artifacts
        if: always()
        run: |
          find backend -type d -name __pycache__ -prune -exec rm -rf {} +
          find backend -type f -name '*.pyc' -delete
          rm -rf frontend/dist "$DOCUMENT_EXPORT_STORAGE_DIR"
